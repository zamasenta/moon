<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Heart - I LOVE YOU</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}
</style>

</head>
<body>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.164.1/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

const heartGroup = new THREE.Group();
scene.add(heartGroup);

function createTextTexture(text){

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 512;
    canvas.height = 128;

    ctx.fillStyle = "rgba(0,0,0,0)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.font = "bold 64px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#FFD700";

    ctx.shadowColor = "#FFD700";
    ctx.shadowBlur = 25;

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );

    const texture = new THREE.CanvasTexture(canvas);

    texture.needsUpdate = true;

    return texture;
}

const textTexture =
    createTextTexture("I LOVE YOU");

const material =
    new THREE.SpriteMaterial({
        map:textTexture,
        transparent:true
    });

function heartPoint(t){

    return {
        x:16*Math.pow(Math.sin(t),3),

        y:
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t)
    };
}

const sprites = [];

for(let i=0;i<3500;i++){

    const t =
        Math.random() *
        Math.PI * 2;

    const h = heartPoint(t);

    const depth =
        (Math.random()-0.5)*30;

    const sprite =
        new THREE.Sprite(
            material.clone()
        );

    sprite.position.set(
        h.x*3,
        h.y*3,
        depth
    );

    const scale =
        Math.random()*2 + 1.5;

    sprite.scale.set(
        scale*5,
        scale,
        1
    );

    heartGroup.add(sprite);
    sprites.push(sprite);
}

const glowLight =
    new THREE.PointLight(
        0xffd700,
        3,
        500
    );

glowLight.position.set(
    0,
    0,
    100
);

scene.add(glowLight);

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

let pulse = 0;

function animate(){

    requestAnimationFrame(
        animate
    );

    pulse += 0.05;

    const scale =
        1 + Math.sin(pulse)*0.05;

    heartGroup.scale.set(
        scale,
        scale,
        scale
    );

    heartGroup.rotation.y += 0.01;
    heartGroup.rotation.x += 0.003;

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
